<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Comforter+Brush&family=Playfair+Display:ital,wght@0,600;1,500&display=swap');

.bouquet{position:absolute;inset:0}.stem{position:absolute;width:7px;height:45%;bottom:13%;left:50%;border-radius:100%;background:linear-gradient(90deg,var(--leaf2),#55b76e,var(--leaf2));transform-origin:bottom center;transform:translateX(-50%) rotate(var(--r))}.leaf{position:absolute;width:26%;height:10%;bottom:31%;left:50%;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#63c87c,var(--leaf2));transform-origin:0 50%;transform:rotate(var(--r))}.leaf.right{transform-origin:100% 50%;border-radius:0 100% 0 100%;transform:translateX(-100%) rotate(var(--r))}

.wrap{position:absolute;left:16%;right:16%;bottom:3%;height:45%;clip-path:polygon(0 0,50% 21%,100% 0,76% 100%,24% 100%);background:linear-gradient(125deg,#e4b98e 0 22%,#f5dcb8 22% 56%,#c78f65 56%);box-shadow:inset 0 0 30px rgba(100,44,27,.2)}.wrap::after{content:"";position:absolute;inset:0;background:linear-gradient(70deg,transparent 45%,rgba(255,255,255,.28) 46% 49%,transparent 50%)}
.ribbon{position:absolute;left:50%;bottom:16%;width:90px;height:36px;transform:translateX(-50%);z-index:3}.ribbon::before,.ribbon::after{content:"";position:absolute;width:55px;height:32px;background:linear-gradient(#ffbad0,#df5a91);top:0}.ribbon::before{right:45%;border-radius:70% 10% 70% 25%;transform:rotate(17deg)}.ribbon::after{left:45%;border-radius:10% 70% 25% 70%;transform:rotate(-17deg)}.knot{position:absolute;width:25px;height:25px;border-radius:50%;background:#e64b88;left:50%;top:5px;transform:translateX(-50%);z-index:2;box-shadow:0 3px 8px #91405f}
.paper{position:absolute;left:50%;top:43%;width:min(92vw,560px);height:min(57vh,520px);transform:translate(-50%,0) scaleY(.03);transform-origin:50% 0;opacity:0;z-index:10;background:var(--paper);color:var(--ink);clip-path:polygon(1% 2%,4% 0,8% 2%,12% 0,16% 2%,20% 0,24% 2%,28% 0,32% 2%,36% 0,40% 2%,44% 0,48% 2%,52% 0,56% 2%,60% 0,64% 2%,68% 0,72% 2%,76% 0,80% 2%,84% 0,88% 2%,92% 0,96% 2%,99% 1%,100% 99%,96% 97%,92% 100%,88% 98%,84% 100%,80% 98%,76% 100%,72% 98%,68% 100%,64% 98%,60% 100%,56% 98%,52% 100%,48% 98%,44% 100%,40% 98%,36% 100%,32% 98%,28% 100%,24% 98%,20% 100%,16% 98%,12% 100%,8% 98%,4% 100%,1% 98%);box-shadow:0 20px 60px rgba(0,0,0,.42);transition:transform 1.5s cubic-bezier(.2,.72,.16,1),opacity .3s;padding:clamp(34px,5vh,55px) clamp(30px,5vw,58px);overflow:auto;scrollbar-width:thin}.paper::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 16% 18%,rgba(195,141,82,.1),transparent 21%),repeating-linear-gradient(0deg,transparent 0 31px,rgba(159,93,122,.08) 32px)}
.paper h2{position:relative;margin:0 0 18px;text-align:center;font-family:"Playfair Display",serif;font-style:italic;font-size:clamp(24px,3vw,34px);color:#c83d79}.message{position:relative;margin:0;white-space:pre-line;font-family:"Playfair Display",serif;font-size:clamp(16px,2vw,21px);line-height:1.68;min-height:11em}.signature{position:relative;text-align:right;margin:14px 0 0;font-family:"Comforter Brush",cursive;font-size:clamp(29px,4vw,42px);color:#d94c87;opacity:0;transform:translateY(8px);transition:.7s}.signature.show{opacity:1;transform:none}.next{position:relative;display:block;margin:18px auto 0;border:0;border-radius:999px;background:linear-gradient(135deg,#e84f8d,#b92f70);color:#fff;padding:11px 23px;cursor:pointer;box-shadow:0 8px 20px rgba(190,45,105,.25);opacity:0;transform:translateY(8px);transition:.7s}.next.show{opacity:1;transform:none}
.petals{position:absolute;inset:0;pointer-events:none;z-index:12}.petal{position:absolute;top:-8%;left:var(--x);width:14px;height:20px;border-radius:80% 20% 70% 30%;background:linear-gradient(135deg,#ffd1e0,#ed6fa3);animation:fall var(--t) linear var(--d) infinite;opacity:.85}

body.opened .intro{opacity:0;transform:scale(1.08);pointer-events:none}body.opened .story-title{opacity:1;transform:translate(-50%,0)}body.opened .gift{transform:translate(-50%,0)}body.letter .paper{opacity:1;transform:translate(-50%,0) scaleY(1)}body.letter .gift{transform:translate(-50%,9%) scale(.88)}body.letter .story-title{opacity:.26}body.final .finale{opacity:1;visibility:visible}body.final .gift,body.final .paper,body.final .story-title{opacity:0;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 0 15px rgba(255,255,255,0),0 0 58px rgba(116,206,255,.95)}}@keyframes stars{to{opacity:1;filter:brightness(1.3)}}@keyframes aurora{to{transform:translate3d(4%,5%,0) scale(1.08)}}@keyframes shoot{0%,70%{transform:translate(-10vw,0) rotate(-16deg);opacity:0}74%{opacity:1}88%,100%{transform:translate(130vw,38vh) rotate(-16deg);opacity:0}}@keyframes sway{to{transform:translateX(-50%) rotate(calc(var(--r) + 3deg))}}@keyframes fall{to{transform:translate(9vw,115vh) rotate(540deg)}}
@media(max-width:800px){.gift{width:min(78vw,420px);height:min(66vh,610px);bottom:5vh}.paper{top:31%;height:min(60vh,520px)}.memories{grid-template-columns:repeat(3,1fr)}.memory:nth-child(n+7){display:none}.story-title{top:5vh}.moon{right:5vw}}
@media(max-height:650px) and (min-width:801px){.gift{height:78vh;width:36vw}.paper{top:34%;height:61vh;padding-top:32px}.story-title{top:18px}}

.hold-guide{font-size:12px!important;letter-spacing:.16em;color:#eff9ff!important;opacity:.82}.open{width:112px;height:112px;padding:0;overflow:visible;animation:none;touch-action:none;user-select:none;background:radial-gradient(circle at 35% 26%,rgba(255,255,255,.38),rgba(74,161,210,.12) 32%,rgba(4,21,49,.62) 74%);box-shadow:inset 0 0 18px rgba(255,255,255,.22),0 0 0 7px rgba(255,255,255,.04),0 0 38px rgba(93,205,255,.55)}
.hold-ring{position:absolute;inset:-9px;width:130px;height:130px;transform:rotate(-90deg);overflow:visible}.hold-ring circle{fill:none;stroke-width:3}.hold-track{stroke:rgba(255,255,255,.14)}.hold-progress{stroke:#bdf3ff;stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3;filter:drop-shadow(0 0 6px #79ddff);transition:stroke-dashoffset .06s linear}
.dome-glare{position:absolute;left:18%;top:12%;width:30%;height:13%;border-radius:50%;border-top:3px solid rgba(255,255,255,.72);transform:rotate(-28deg);filter:blur(.4px)}.mini-garden{position:absolute;inset:15px;border-radius:50%;overflow:hidden}.mini-soil{position:absolute;left:14%;right:14%;height:24%;bottom:6%;border-radius:50%;background:radial-gradient(ellipse at 50% 15%,#79503e,#2e1b22 70%);box-shadow:0 -3px 9px rgba(255,208,159,.2)}.mini-stem{position:absolute;bottom:22%;left:50%;width:4px;height:0;border-radius:8px;background:linear-gradient(90deg,#20724c,#6bd68a,#1b6a47);transform:translateX(-50%);transition:height 1.25s cubic-bezier(.2,.8,.2,1)}.mini-stem::before,.mini-stem::after{content:"";position:absolute;width:20px;height:10px;top:45%;background:#55b978}.mini-stem::before{right:1px;border-radius:100% 0 100% 0;transform:rotate(25deg)}.mini-stem::after{left:1px;border-radius:0 100% 0 100%;transform:rotate(-25deg)}.mini-bloom{position:absolute;left:50%;bottom:59%;width:30px;height:32px;transform:translate(-50%,15px) scale(0);transition:transform .8s 1s cubic-bezier(.2,1.7,.35,1);filter:drop-shadow(0 0 8px #ff9dc1)}.mini-bloom i{position:absolute;bottom:0;width:18px;height:28px;border-radius:60% 60% 45% 45%;background:linear-gradient(135deg,#ffd8e6,#ed6099 70%)}.mini-bloom i:nth-child(1){left:0;transform:rotate(-25deg);transform-origin:bottom}.mini-bloom i:nth-child(2){left:6px;z-index:2}.mini-bloom i:nth-child(3){right:0;transform:rotate(25deg);transform-origin:bottom}.open.holding .mini-stem,.open.complete .mini-stem{height:43%}.open.complete .mini-bloom{transform:translate(-50%,0) scale(1)}.open.holding{box-shadow:inset 0 0 24px rgba(255,255,255,.35),0 0 0 11px rgba(137,226,255,.08),0 0 62px rgba(107,220,255,.92)}.open.complete::after{content:"";position:absolute;inset:-24px;border:2px solid #d8f7ff;border-radius:50%;animation:shock .8s ease-out forwards}
.spark-burst{position:absolute;inset:-35px;pointer-events:none}.spark-burst i{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#fff8c4;box-shadow:0 0 8px #fff;opacity:0}.open.complete .spark-burst i{animation:burst .85s var(--delay) ease-out forwards;transform:rotate(var(--angle)) translateY(-54px)}
.story-title::after{content:"";display:block;width:min(330px,72vw);height:1px;margin:13px auto 0;background:linear-gradient(90deg,transparent,#fff3b9,transparent);box-shadow:0 0 12px #fff0a5}.story-title b{background:linear-gradient(90deg,#dff7ff,#fff,#ffe7a8,#fff,#dff7ff);background-size:250% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:titleShine 5s linear infinite}
.tulip{opacity:0;transform:translateX(-50%) translateY(55px) rotate(var(--r)) scale(.35)}body.opened .tulip{animation:bloomIn 1.25s calc(.9s + var(--n)*.12s) cubic-bezier(.16,1.35,.3,1) forwards,sway 4s calc(2.3s + var(--d)) ease-in-out infinite alternate}.tulip::before{clip-path:polygon(4% 8%,24% 18%,36% 4%,50% 19%,65% 3%,77% 18%,96% 7%,91% 58%,74% 84%,50% 100%,25% 84%,9% 58%)}.tulip .core{position:absolute;z-index:4;left:42%;top:35%;width:16%;height:29%;border-radius:50%;background:linear-gradient(#fff4bd,#ffbb62);box-shadow:0 0 9px #fff2a8;opacity:.82}.tulip .shine{position:absolute;z-index:5;left:16%;top:16%;width:17%;height:29%;border-radius:50%;border-left:3px solid rgba(255,255,255,.58);transform:rotate(18deg)}
.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:#fff2a3;box-shadow:0 0 5px #fff,0 0 13px #ffe67d;left:var(--x);top:var(--y);animation:drift var(--t) ease-in-out var(--d) infinite alternate;z-index:2}
.meadow{position:absolute;left:-5%;right:-5%;bottom:-8%;height:38%;z-index:1;border-radius:50% 50% 0 0/28% 28% 0 0;background:radial-gradient(ellipse at 50% -5%,rgba(65,190,145,.28),transparent 52%),linear-gradient(180deg,#144941 0%,#0c3733 42%,#052125 100%);box-shadow:inset 0 4px 22px rgba(120,240,195,.18),0 -12px 35px rgba(20,80,70,.32);pointer-events:none}
.meadow-canvas{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;z-index:2;pointer-events:none}
.dog-path{position:absolute;left:-130px;bottom:8.5%;z-index:7;width:116px;height:82px;animation:dogJourney 13s linear infinite;filter:drop-shadow(0 11px 8px rgba(0,0,0,.3))}.dog-sprite{position:relative;width:116px;height:82px;animation:dogBounce .48s ease-in-out infinite alternate}.dog-body{position:absolute;left:25px;top:32px;width:62px;height:34px;border-radius:48% 52% 45% 46%;background:linear-gradient(145deg,#d99955,#a85c31 75%);box-shadow:inset 0 -7px 0 rgba(102,47,29,.2)}.dog-body::after{content:"";position:absolute;right:6px;top:5px;width:21px;height:21px;border-radius:50%;background:#f2c27d;opacity:.75}.dog-head{position:absolute;right:2px;top:14px;width:43px;height:42px;border-radius:52% 48% 48% 48%;background:linear-gradient(145deg,#e4a35e,#ba6b38);transform:rotate(5deg)}.dog-ear{position:absolute;left:-5px;top:3px;width:17px;height:28px;border-radius:70% 25% 75% 35%;background:#75402d;transform:rotate(24deg);transform-origin:top}.dog-eye{position:absolute;right:10px;top:12px;width:5px;height:6px;border-radius:50%;background:#261b1a;box-shadow:0 0 0 2px rgba(255,255,255,.18)}.dog-muzzle{position:absolute;right:-8px;top:21px;width:23px;height:16px;border-radius:60% 55% 55% 60%;background:#f5d19a}.dog-nose{position:absolute;right:-2px;top:22px;width:8px;height:7px;border-radius:55%;background:#251b1c}.dog-tongue{position:absolute;right:4px;top:34px;width:8px;height:10px;border-radius:0 0 60% 60%;background:#ef7f89;animation:tongue .48s ease-in-out infinite alternate}.dog-tail{position:absolute;left:12px;top:25px;width:34px;height:13px;border-radius:70% 10% 60% 25%;background:#b96c39;transform:rotate(-28deg);transform-origin:right center;animation:tailWag .25s ease-in-out infinite alternate}.dog-leg{position:absolute;top:57px;width:12px;height:24px;border-radius:6px 6px 9px 9px;background:#bc713f;transform-origin:top}.dog-leg.back{left:36px;animation:legRun .48s ease-in-out infinite alternate}.dog-leg.front{left:75px;animation:legRun .48s -.24s ease-in-out infinite alternate}.dog-leg::after{content:"";position:absolute;left:-1px;bottom:-1px;width:16px;height:7px;border-radius:60% 70% 45% 45%;background:#f1c17d}.dog-collar{position:absolute;right:34px;top:31px;width:7px;height:29px;border-radius:5px;background:#e95b73;transform:rotate(-80deg);z-index:3}.dog-collar::after{content:"";position:absolute;left:0;bottom:-5px;width:7px;height:7px;border-radius:50%;background:#ffd76a;box-shadow:0 0 5px #ffe9a5}
@keyframes shock{to{inset:-70px;opacity:0}}@keyframes burst{0%{opacity:0;transform:rotate(var(--angle)) translateY(-12px) scale(.2)}35%{opacity:1}100%{opacity:0;transform:rotate(var(--angle)) translateY(-72px) scale(1.2)}}@keyframes titleShine{to{background-position:250% center}}@keyframes bloomIn{to{opacity:1;transform:translateX(-50%) translateY(0) rotate(var(--r)) scale(1)}}@keyframes drift{to{transform:translate(45px,-38px) scale(1.7);opacity:.4}}@keyframes grassBreathe{to{transform:skewX(2deg) translateX(8px)}}@keyframes dogJourney{0%{left:-140px;transform:translateY(8px)}34%{transform:translateY(5px)}42%{transform:translateY(-52px) rotate(-7deg)}49%{transform:translateY(5px) rotate(0)}78%{transform:translateY(4px)}84%{transform:translateY(-30px) rotate(-4deg)}90%{transform:translateY(5px)}100%{left:calc(100% + 40px);transform:translateY(8px)}}@keyframes dogBounce{to{transform:translateY(-5px) rotate(-1deg)}}@keyframes legRun{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}@keyframes tailWag{from{transform:rotate(-44deg)}to{transform:rotate(-8deg)}}@keyframes tongue{to{height:7px;transform:translateY(-1px)}}

  function revealGift(){if(opened)return;opened=true;openButton.classList.remove('holding');openButton.classList.add('complete');holdGuide.textContent='MÓN QUÀ ĐANG NỞ...';holdProgress.style.strokeDashoffset='0';chime();setTimeout(()=>body.classList.add('opened'),520);setTimeout(()=>{body.classList.add('letter');setTimeout(typeMessage,900)},4300)}
  function updateHold(time){if(!holdStart)holdStart=time;const ratio=Math.min(1,(time-holdStart)/1700);holdProgress.style.strokeDashoffset=String(339.3*(1-ratio));if(ratio===1){cancelAnimationFrame(holdFrame);revealGift()}else holdFrame=requestAnimationFrame(updateHold)}
  function beginHold(event){if(opened)return;event.preventDefault();holdStart=0;openButton.classList.add('holding');holdGuide.textContent='ĐỪNG BUÔNG NHÉ...';holdFrame=requestAnimationFrame(updateHold)}
  function cancelHold(){if(opened)return;cancelAnimationFrame(holdFrame);openButton.classList.remove('holding');holdProgress.style.strokeDashoffset='339.3';holdGuide.textContent='ẤN GIỮ ĐỂ HOA NỞ'}
  openButton.addEventListener('pointerdown',beginHold);openButton.addEventListener('pointerup',cancelHold);openButton.addEventListener('pointerleave',cancelHold);openButton.addEventListener('pointercancel',cancelHold);openButton.addEventListener('keydown',event=>{if((event.key===' '||event.key==='Enter')&&!event.repeat)beginHold(event)});openButton.addEventListener('keyup',event=>{if(event.key===' '||event.key==='Enter')cancelHold()});
  document.querySelector('#letter').addEventListener('click',event=>{if(event.target!==next&&typing<text.length)finishTyping()});
  next.addEventListener('click',()=>{body.classList.add('final');chime()});
  document.querySelector('#replay').addEventListener('click',()=>{clearInterval(timer);cancelAnimationFrame(holdFrame);typing=0;opened=false;holdStart=0;message.textContent='';signature.classList.remove('show');next.classList.remove('show');openButton.classList.remove('holding','complete');holdProgress.style.strokeDashoffset='339.3';holdGuide.textContent='ẤN GIỮ ĐỂ HOA NỞ';body.className='';setTimeout(()=>openButton.focus(),700)});
  document.querySelector('#photos').addEventListener('change',event=>{
    const cards=[...document.querySelectorAll('.memory .visual')];
    [...event.target.files].slice(0,cards.length).forEach((file,index)=>{const image=document.createElement('img');image.alt=`Ảnh kỷ niệm ${index+1}`;image.src=URL.createObjectURL(file);cards[index].replaceChildren(image)});
  });
  function decorateScene(){
    document.querySelectorAll('.tulip').forEach((flower,index)=>{flower.style.setProperty('--n',index);flower.insertAdjacentHTML('beforeend','<i class="core"></i><i class="shine"></i>')});
    const scene=document.querySelector('.scene');for(let i=0;i<34;i++){const light=document.createElement('i');light.className='firefly';light.style.cssText=`--x:${3+Math.random()*94}%;--y:${18+Math.random()*70}%;--t:${2.5+Math.random()*4}s;--d:${-Math.random()*5}s`;scene.append(light)}
    const burst=document.querySelector('.spark-burst');for(let i=0;i<16;i++){const spark=document.createElement('i');spark.style.cssText=`--angle:${i*22.5}deg;--delay:${(i%4)*.035}s`;burst.append(spark)}
  }
  function initMeadowGrass(){
    const canvas=document.querySelector('#meadowCanvas');
    if(!canvas)return;
    const ctx=canvas.getContext('2d');
    let width=0,height=0,dpr=1,blades=[],spores=[];
    const mouse={x:-9999,y:-9999,lastX:-9999,lastY:-9999,vx:0,vy:0,active:false};

    function getCrestY(x){
      const nx=(x-width*.5)/(width*.58);
      return height*.21+nx*nx*(height*.23);
    }

    function buildBlades(){
      blades=[];
      const count=Math.min(580,Math.max(220,Math.floor(width/2.2)));
      for(let i=0;i<count;i++){
        const x=(i/count)*(width+60)-30+(Math.random()-.5)*12;
        const crest=getCrestY(x);
        const depth=Math.pow(Math.random(),.82);
        const baseY=Math.min(height-6,crest+depth*(height-crest+12));
        const layer=depth<.26?0:(depth<.68?1:2);

        let h,w;
        if(layer===0){h=44+Math.random()*38;w=2.0+Math.random()*.9}
        else if(layer===1){h=62+Math.random()*46;w=2.9+Math.random()*1.1}
        else{h=82+Math.random()*56;w=4.0+Math.random()*1.4}

        let flower=null;
        if(layer>0&&Math.random()<.1){
          const fRand=Math.random();
          if(fRand<.45)flower={type:'daisy',color:'#ffffff',center:'#ffd24d',size:3.5+Math.random()*2};
          else if(fRand<.75)flower={type:'pink',color:'#fca5a5',center:'#fff1f2',size:3.6+Math.random()*2};
          else flower={type:'bell',color:'#c084fc',center:'#ede9fe',size:4.2+Math.random()*2};
        }

        blades.push({
          x,baseY,h,w,layer,
          naturalLean:(Math.random()-.5)*.32,
          phase:Math.random()*Math.PI*2,
          speed:1.5+Math.random()*1.2,
          interactiveLean:0,
          flower
        });
      }
      blades.sort((a,b)=>a.baseY-b.baseY);
    }

    function buildSpores(){
      spores=[];
      const count=Math.min(32,Math.floor(width/38));
      for(let i=0;i<count;i++){
        spores.push({
          x:Math.random()*width,
          y:height*(.25+Math.random()*.7),
          vx:.18+Math.random()*.35,
          vy:-.16-Math.random()*.28,
          r:1.2+Math.random()*1.5,
          phase:Math.random()*Math.PI*2,
          alpha:.3+Math.random()*.6
        });
      }
    }

    function resize(){
      dpr=Math.min(window.devicePixelRatio||1,2);
      width=canvas.offsetWidth;
      height=canvas.offsetHeight;
      if(!width||!height)return;
      canvas.width=Math.floor(width*dpr);
      canvas.height=Math.floor(height*dpr);
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(dpr,dpr);
      buildBlades();
      buildSpores();
    }

    window.addEventListener('pointermove',e=>{
      const rect=canvas.getBoundingClientRect();
      const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
      if(mouse.lastX>-1000){mouse.vx=cx-mouse.lastX;mouse.vy=cy-mouse.lastY}
      mouse.x=cx;mouse.y=cy;mouse.lastX=cx;mouse.lastY=cy;
      mouse.active=(cy>=-40&&cy<=height+40&&cx>=-40&&cx<=width+40);
    });
    window.addEventListener('pointerleave',()=>{mouse.active=false;mouse.x=-9999;mouse.y=-9999});

    function drawBlade(b,tipX,tipY,ctrlX,ctrlY){
      ctx.beginPath();
      ctx.moveTo(b.x-b.w*.5,b.baseY);
      ctx.quadraticCurveTo(ctrlX-b.w*.25,ctrlY,tipX,tipY);
      ctx.quadraticCurveTo(ctrlX+b.w*.25,ctrlY,b.x+b.w*.5,b.baseY);
      ctx.closePath();

      const grad=ctx.createLinearGradient(b.x,b.baseY,tipX,tipY);
      if(b.layer===0){
        grad.addColorStop(0,'#0a2e28');
        grad.addColorStop(.5,'#134e42');
        grad.addColorStop(1,'#267f6b');
      }else if(b.layer===1){
        grad.addColorStop(0,'#0c372f');
        grad.addColorStop(.4,'#196853');
        grad.addColorStop(.85,'#38b88f');
        grad.addColorStop(1,'#86efac');
      }else{
        grad.addColorStop(0,'#0e4237');
        grad.addColorStop(.35,'#23866a');
        grad.addColorStop(.8,'#4ade80');
        grad.addColorStop(1,'#fef08a');
      }
      ctx.fillStyle=grad;
      ctx.fill();

      if(b.flower)drawFlower(b.flower,tipX,tipY,ctrlX,ctrlY);
    }

    function drawFlower(f,x,y,cx,cy){
      const angle=Math.atan2(y-cy,x-cx);
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(angle);
      if(f.type==='daisy'||f.type==='pink'){
        ctx.fillStyle=f.color;
        for(let i=0;i<5;i++){
          const a=(i*Math.PI*2)/5;
          ctx.beginPath();
          ctx.arc(Math.cos(a)*(f.size*.65),Math.sin(a)*(f.size*.65),f.size*.4,0,Math.PI*2);
          ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(0,0,f.size*.32,0,Math.PI*2);
        ctx.fillStyle=f.center;
        ctx.fill();
      }else{
        ctx.fillStyle=f.color;
        ctx.beginPath();
        ctx.ellipse(0,0,f.size*.75,f.size*.45,0,0,Math.PI*2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(f.size*.4,0,f.size*.22,0,Math.PI*2);
        ctx.fillStyle=f.center;
        ctx.fill();
      }
      ctx.restore();
    }

    let lastDogX=-9999;
    function render(now){
      const t=now*.001;
      ctx.clearRect(0,0,width,height);

      // Dog position tracking for interactive wake
      let dogX=-9999;
      const dogEl=document.querySelector('.dog-path');
      if(dogEl){
        const dogRect=dogEl.getBoundingClientRect();
        const cRect=canvas.getBoundingClientRect();
        dogX=dogRect.left+dogRect.width*.5-cRect.left;
      }

      const waveSpeed=t*2.1;
      const deepWind=Math.sin(t*.68)*6.5;

      for(let i=0;i<blades.length;i++){
        const b=blades[i];
        if(mouse.active){
          const dx=b.x-mouse.x;
          const dy=(b.baseY-b.h*.5)-mouse.y;
          const dist=Math.hypot(dx,dy);
          if(dist<110){
            const pushForce=(1-dist/110)*.65;
            const pushDir=(dx>=0?1:-1)+(mouse.vx?mouse.vx*.04:0);
            b.interactiveLean+=pushDir*pushForce;
          }
        }
        if(dogX>-100&&dogX<width+100){
          const dDist=Math.abs(b.x-dogX);
          if(dDist<65){
            const dForce=(1-dDist/65)*.45;
            b.interactiveLean+=(b.x>=dogX?.75:-.25)*dForce;
          }
        }
        b.interactiveLean*=.93;

        const localWind=Math.sin(waveSpeed+b.x*.005+b.phase)*(8+b.layer*3.2)+
                        Math.cos(t*1.2-b.x*.008)*4+
                        deepWind;

        const totalLean=b.naturalLean*b.h+localWind+b.interactiveLean*24;
        const ctrlX=b.x+totalLean*.46;
        const ctrlY=b.baseY-b.h*.56;
        const tipX=b.x+totalLean;
        const tipY=b.baseY-b.h;

        drawBlade(b,tipX,tipY,ctrlX,ctrlY);
      }

      for(let i=0;i<spores.length;i++){
        const s=spores[i];
        s.x+=s.vx+Math.sin(t*2+s.phase)*.25;
        s.y+=s.vy;
        if(s.y<height*.14){s.y=height*(.82+Math.random()*.18);s.x=Math.random()*width}
        if(s.x>width+20)s.x=-20;
        const pulse=.35+.65*Math.sin(t*3.4+s.phase);
        const alpha=s.alpha*pulse;

        const grad=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*2.6);
        grad.addColorStop(0,`rgba(255,250,190,${alpha})`);
        grad.addColorStop(.5,`rgba(150,255,200,${alpha*.42})`);
        grad.addColorStop(1,'rgba(150,255,200,0)');
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r*2.6,0,Math.PI*2);
        ctx.fillStyle=grad;
        ctx.fill();
      }

      if(!reduced)requestAnimationFrame(render);
    }

    resize();
    window.addEventListener('resize',resize);
    requestAnimationFrame(render);
  }

  makePetals();buildMemories();decorateScene();initMeadowGrass();
})();
</script>
